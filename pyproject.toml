[project]
name = "rdino-bert"
version = "0.1.0"
description = "Multimodal BERT and RDINO training for windowed speech data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "peft>=0.11,<1",
    "pyyaml>=6,<7",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "soundfile>=0.12,<1",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transformers>=4.40,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
